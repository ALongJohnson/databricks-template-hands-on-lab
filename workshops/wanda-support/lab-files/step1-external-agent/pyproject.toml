[project]
name = "wanda-external"
version = "1.0.0"
description = "Wanderbricks guest-support agent, as it runs today outside Databricks"
requires-python = ">=3.11"
dependencies = [
    "openai-agents==0.25.0",
    "openai==3.57.0",
    "python-dotenv==1.2.4",
    # Step 3 only: MLflow 3 tracing into Unity Catalog
    "mlflow[databricks]==3.18.0",
]

[project.scripts]
wanda = "wanda.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wanda"]
